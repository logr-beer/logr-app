; Matches docker/nginx.conf's client_max_body_size, which is the actual
; outer limit. PHP's compiled-in defaults (upload_max_filesize=2M,
; post_max_size=8M) are otherwise well below what nginx and Livewire's
; photo validation (max:10240 KB) already allow.
upload_max_filesize = 20M
post_max_size = 20M
