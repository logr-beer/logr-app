server {
    listen 8337;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only the front controller runs as PHP. Any other *.php path (including
    # user uploads under /storage/) returns 404 instead of reaching PHP-FPM.
    # Manual check: `curl -i http://localhost:8337/storage/x.php` -> 404.
    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
