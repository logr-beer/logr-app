# Debian's fastcgi_params sets HTTP_HOST to $host, which drops the port, so
# Laravel would build redirects like http://127.0.0.1/setup when the container
# is published on a non-80 host port. Pass the client's Host header (with port)
# instead, falling back to $host when the request has none.
map $http_host $logr_http_host {
    ""      $host;
    default $http_host;
}

server {
    listen 8337;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_HOST $logr_http_host;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
